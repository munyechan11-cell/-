name: Build & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    # vite build 는 타입을 검사하지 않는다. 타입 오류가 CI 를 통과해
    # 런타임까지 흘러가지 않도록 별도 단계로 세운다.
    - name: Typecheck
      run: npm run lint

    - name: Test
      run: npm test

    - name: Build the project
      run: npm run build
      
    # 여기에 배포 파이프라인 (Firebase Hosting, Vercel, AWS 등)을 연동할 수 있습니다.
    # - name: Deploy to Vercel
    #   run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
