<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 250" width="1080" height="250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>실증 운영 효과 지표</title>
  <desc>파일럿 매장 연심의 도입 전후 운영 지표 비교: 마감 정산 시간, 매출 수기 입력, 매출 누락, 적립 회원, 재방문율</desc>
  <rect x="0" y="0" width="1080" height="250" rx="18" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#16308f">실증 운영 효과 — 파일럿 매장 ‘연심’ · 12주 운영</text>
  <text x="540" y="54" text-anchor="middle" font-size="12.5" fill="#6a7a9c">도입 전  →  도입 후</text>

  <rect x="20" y="68" width="200" height="136" rx="12" fill="#eef4fd" stroke="#c5d8f5" stroke-width="1.5"/>
  <text x="120" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15275c">마감 정산 시간</text>
  <text x="120" y="136" text-anchor="middle"><tspan font-size="15" fill="#8a97b3">40분</tspan><tspan font-size="15" fill="#16308f">  →  </tspan><tspan font-size="20" font-weight="700" fill="#16308f">5분</tspan></text>
  <rect x="86" y="158" width="68" height="26" rx="13" fill="#16308f"/>
  <text x="120" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▼ 88%</text>

  <rect x="230" y="68" width="200" height="136" rx="12" fill="#eef4fd" stroke="#c5d8f5" stroke-width="1.5"/>
  <text x="330" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15275c">매출 수기 입력</text>
  <text x="330" y="136" text-anchor="middle"><tspan font-size="15" fill="#8a97b3">주 5시간</tspan><tspan font-size="15" fill="#16308f">  →  </tspan><tspan font-size="20" font-weight="700" fill="#16308f">0</tspan></text>
  <rect x="296" y="158" width="68" height="26" rx="13" fill="#16308f"/>
  <text x="330" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▼ 100%</text>

  <rect x="440" y="68" width="200" height="136" rx="12" fill="#eef4fd" stroke="#c5d8f5" stroke-width="1.5"/>
  <text x="540" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15275c">매출 누락</text>
  <text x="540" y="136" text-anchor="middle"><tspan font-size="15" fill="#8a97b3">월 6~8건</tspan><tspan font-size="15" fill="#16308f">  →  </tspan><tspan font-size="20" font-weight="700" fill="#16308f">0건</tspan></text>
  <rect x="506" y="158" width="68" height="26" rx="13" fill="#16308f"/>
  <text x="540" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▼ 100%</text>

  <rect x="650" y="68" width="200" height="136" rx="12" fill="#eef4fd" stroke="#c5d8f5" stroke-width="1.5"/>
  <text x="750" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15275c">적립 회원</text>
  <text x="750" y="136" text-anchor="middle"><tspan font-size="15" fill="#8a97b3">120명</tspan><tspan font-size="15" fill="#16308f">  →  </tspan><tspan font-size="20" font-weight="700" fill="#16308f">410명</tspan></text>
  <rect x="713" y="158" width="74" height="26" rx="13" fill="#2f63c9"/>
  <text x="750" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▲ 3.4배</text>

  <rect x="860" y="68" width="200" height="136" rx="12" fill="#eef4fd" stroke="#c5d8f5" stroke-width="1.5"/>
  <text x="960" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#15275c">재방문율</text>
  <text x="960" y="136" text-anchor="middle"><tspan font-size="15" fill="#8a97b3">28%</tspan><tspan font-size="15" fill="#16308f">  →  </tspan><tspan font-size="20" font-weight="700" fill="#16308f">39%</tspan></text>
  <rect x="923" y="158" width="74" height="26" rx="13" fill="#2f63c9"/>
  <text x="960" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">▲ 11%p</text>

  <text x="540" y="230" text-anchor="middle" font-size="11.5" fill="#8a97b3">※ 예시 수치 — 실제 운영 데이터로 교체 필요 · 파일럿 매장: 연심(점주 포함 3인, 일평균 약 80건)</text>
</svg>
